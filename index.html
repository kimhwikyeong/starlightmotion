<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>별빛 손짓</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Gowun+Batang:wght@700&display=swap">
<style>
:root{--ink:#f4efe2;--sub:#b9b3a4;--gold:#e9cf8e;--line:rgba(233,207,142,.3);--panel:rgba(10,12,24,.66)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;width:100%;background:#000;color:var(--ink);font-family:"Gowun Dodum","Noto Sans KR",system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
/* 1층: 카메라 */
/* 카메라 영상은 숨겨 두고, 손 인식에 쓴 바로 그 장면을 #camcv에 그려서 보여 줘요 (화면 속 손과 별빛이 어긋나지 않게) */
#cam{position:fixed;left:0;top:0;width:2px;height:2px;opacity:.01;pointer-events:none}
#camcv{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);filter:brightness(var(--camB,.5)) saturate(.6);opacity:var(--camA,1)}
#camcv.noflip{transform:none}
#sky{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 30%,rgba(30,40,90,.3),rgba(5,6,16,.5) 75%);pointer-events:none}
/* 2·3층: 별 + 손 */
#cv{position:fixed;inset:0;width:100%;height:100%}
/* 오른쪽 아래 작은 조절판 (평소에는 흐린 점 하나) */
#knob{position:fixed;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));width:40px;height:40px;border-radius:999px;border:1px solid rgba(244,239,226,.18);background:rgba(10,12,24,.25);color:rgba(244,239,226,.45);font-size:18px;display:grid;place-items:center;cursor:pointer;transition:opacity .3s}
#knob.dim{opacity:.35}
#panel{position:fixed;right:max(14px,env(safe-area-inset-right));bottom:calc(max(14px,env(safe-area-inset-bottom)) + 50px);width:250px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px 16px 12px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:none}
#panel.open{display:block}
#panel label{display:block;font-size:14px;color:var(--sub);margin:0 0 10px}
#panel label span{float:right;color:var(--ink)}
#panel input[type=range]{width:100%;margin:6px 0 0;accent-color:var(--gold);height:28px}
#panel .row{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
#panel button{font:inherit;font-size:13px;color:var(--ink);background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:10px;min-height:36px;padding:0 10px;cursor:pointer;flex:1 1 auto}
#panel button.warn{border-color:#ffb36b;color:#ffd7ac}
.sp{position:relative;margin:2px 0 12px}
#spBtn{display:flex!important;align-items:center;gap:10px;width:100%;text-align:left;padding:4px 10px!important;min-height:52px!important}
#spBtn canvas,#spList canvas{width:44px;height:44px;border-radius:10px;background:#070915;flex:none}
#spBtn span{flex:1;font-size:15px}#spBtn em{font-style:normal;color:var(--sub)}
#spList{display:none;margin-top:6px;max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:12px;background:rgba(8,10,22,.96)}
#spList.open{display:block}
#spList div{display:flex;align-items:center;gap:10px;padding:5px 8px;cursor:pointer;font-size:14px;border-bottom:1px solid rgba(233,207,142,.08)}
#spList div:last-child{border-bottom:0}
#spList div.on{background:rgba(233,207,142,.16);color:#fff}
#panel{max-height:calc(100vh - 90px);overflow:auto}
#panel .ver{margin-top:8px;font-size:11px;color:rgba(244,239,226,.45);text-align:right}
/* 손 모양 안내 (시작 화면과 조절판에서만) */
.guide{list-style:none;margin:0;padding:0;display:grid;gap:4px;text-align:left}
.guide li{display:flex;align-items:center;gap:10px;font-size:16px;color:var(--ink)}
.guide li i{font-style:normal;font-size:22px;width:32px;text-align:center}
.guide li small{color:var(--sub);font-size:14px}
#help{position:fixed;inset:0;display:none;place-items:center;background:rgba(3,4,10,.55);z-index:5}
#help.open{display:grid}
#help .card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px 22px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#help h3,#start h3{margin:0 0 10px;font:700 18px "Gowun Batang",serif;color:var(--gold)}
#start{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 40%,#18204a,#05060c 70%);z-index:10;text-align:center;padding:24px;overflow:auto}
#start h1{font:700 clamp(40px,8vw,72px)/1.1 "Gowun Batang",serif;margin:0 0 10px;letter-spacing:.02em}
#start p{color:var(--sub);font-size:18px;margin:0 0 20px;line-height:1.6}
#start .gbox{display:inline-block;margin:0 0 24px;padding:14px 18px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.03)}
#start .go{font:inherit;font-size:22px;background:var(--gold);color:#1a1606;border:0;border-radius:999px;padding:16px 40px;cursor:pointer}
#start .alt{display:block;margin:14px auto 0;font:inherit;font-size:15px;color:var(--sub);background:none;border:0;text-decoration:underline;cursor:pointer}
#start .msg{margin-top:16px;font-size:16px;color:#ffd7ac;min-height:1.4em}
#start .ver2{margin-top:16px;font-size:13px;color:rgba(244,239,226,.5)}
.toast{position:fixed;left:50%;bottom:16%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:9px 18px;font-size:16px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
#shot{position:fixed;right:max(14px,env(safe-area-inset-right));top:50%;transform:translateY(-50%);width:64px;height:64px;border-radius:999px;border:2px solid rgba(244,239,226,.32);background:rgba(10,12,24,.15);cursor:pointer;padding:0}
#shot::after{content:"";position:absolute;inset:7px;border-radius:999px;background:rgba(244,239,226,.16)}
#shot:active::after{background:rgba(244,239,226,.6)}
#count{position:fixed;inset:0;display:none;place-items:center;font:700 min(34vw,260px)/1 "Gowun Batang",serif;color:rgba(255,248,225,.9);text-shadow:0 0 40px rgba(233,207,142,.6);pointer-events:none;z-index:6}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:7;transition:opacity .5s}
#panel button.on{background:rgba(233,207,142,.22);border-color:var(--gold)}
.guide li i{width:52px;display:flex;justify-content:center}
.guide li i svg{height:44px;width:auto}
.guide li i.emo{width:84px;font-size:26px;font-family:"Apple Color Emoji","Noto Color Emoji","Segoe UI Emoji",sans-serif;white-space:nowrap;gap:2px;align-items:center}
.guide li i.emo b{font:400 16px "Gowun Batang",serif;color:var(--gold)}
.guide li i.emo em{font-style:normal;display:inline-block;transform:rotate(90deg)}
.guide li{white-space:nowrap}
.guide li i.emo .diag{position:relative;width:60px;height:46px;display:block}
.guide li i.emo .diag em{position:absolute;font-size:19px}
.guide li i.emo .diag .a{left:4px;bottom:0}.guide li i.emo .diag .c{right:4px;top:0}
.guide li i.emo .diag b{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
#start .guide{grid-template-columns:1fr 1fr;column-gap:22px}
@media (max-width:720px){#start .guide{grid-template-columns:1fr}}
</style>
</head>
<body>
<video id="cam" playsinline muted autoplay></video>
<canvas id="camcv" width="2" height="2"></canvas>
<div id="sky"></div>
<canvas id="cv"></canvas>

<button id="knob" class="dim" aria-label="조절판">◐</button>
<button id="shot" aria-label="사진 찍기"></button>
<div id="count"></div><div id="flash"></div>
<div id="panel">
  <label>카메라 밝기 <span id="vB"></span><input type="range" id="sB" min="5" max="120" step="1"></label>
  <label>카메라 투명도 <span id="vA"></span><input type="range" id="sA" min="0" max="100" step="1"></label>
  <label>한 번에 인식할 손 <span id="vN"></span><input type="range" id="sN" min="1" max="6" step="1"></label>
  <label>별 모양</label>
  <div class="sp" id="sp"><button type="button" id="spBtn"><canvas width="88" height="88"></canvas><span id="spName"></span><em>▾</em></button><div id="spList"></div></div>
  <div class="row"><button id="bTrace">별자리 따라 그리기 켜기</button></div>
  <div class="row"><button id="bClear">모두 지우기</button><button id="bFlip">좌우 반전</button></div>
  <div class="row"><button id="bFull">전체화면</button><button id="bHelp">손 모양 안내</button></div>
  <div class="ver" id="spd"></div><div class="ver" id="ver"></div>
</div>
<div id="help"><div class="card"><h3>손 모양</h3><ul class="guide" id="guide2"></ul></div></div>
<div class="toast" id="toast"></div>

<div id="start">
  <div>
    <h1>별빛 손짓</h1>
    <p>손가락으로 밤하늘에 별을 띄워 보세요.</p>
    <div class="gbox"><h3>손 모양</h3><ul class="guide" id="guide1"></ul></div><br>
    <button class="go" id="go">카메라 켜고 시작</button>
    <button class="alt" id="goFull">전체화면으로 시작</button>
    <button class="alt" id="touchOnly">카메라 없이 손가락(터치)으로 하기</button>
    <div class="msg" id="msg"></div>
    <div class="ver2" id="ver2"></div>
  </div>
</div>

  x.fillText(`별빛 손짓${st.trace ? ' · ' + CONS[st.ci].ko : ''} · ${d.getFullYear()}.${p(d.getMonth() + 1)}.${p(d.getDate())}`, c.width - 18 * DPR, c.height - 18 * DPR);
  const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.92));
  const name = `starhand_${p(d.getMonth() + 1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}.jpg`;
  // 자동 저장: 공유 창 없이 바로 내려받기
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 8000);
  shots++; toast(`사진을 저장했어요 (${shots}장째)`);
}
let shots = 0, shooting = false;
$('shot').onclick = async () => {
  if (shooting) return; shooting = true; $('panel').classList.remove('open');
  const cEl = $('count'); cEl.style.display = 'grid';
  for (const n of [3, 2, 1]) { cEl.textContent = n; await new Promise(r => setTimeout(r, 900)); }
  cEl.style.display = 'none';
  const f = $('flash'); f.style.transition = 'none'; f.style.opacity = '.85';
  requestAnimationFrame(() => { f.style.transition = 'opacity .5s'; f.style.opacity = '0'; });
  try { await capture(); } catch (e) { console.warn(e); toast('사진을 저장하지 못했어요'); }
  shooting = false;
};
$('bTrace').onclick = () => { st.trace = !st.trace; saveSet(); applySet(); traceDone = false; $('panel').classList.remove('open'); };

/* ---------- 시작 ---------- */
let started = false;
function begin() { if (started) return; started = true; $('start').style.display = 'none'; requestAnimationFrame(loop); }
$('go').onclick = async () => {
  $('go').disabled = true;
  try { await startCamera(); begin(); }
  catch (e) {
    console.warn(e); $('go').disabled = false;
    const m = String(e && e.message || e);
    $('msg').textContent = /Permission|NotAllowed/i.test(m) ? '카메라 허용이 필요해요. 주소창의 카메라 설정을 확인해 주세요.' : /NotFound|Requested device/i.test(m) ? '카메라를 찾지 못했어요.' : '시작하지 못했어요: ' + m;
  }
};
$('goFull').onclick = async () => { if (fsOK()) { try { const d = document.documentElement; await (d.requestFullscreen || d.webkitRequestFullscreen).call(d); } catch (e) {} } $('go').click(); };
if (!fsOK()) $('goFull').style.display = 'none';
$('touchOnly').onclick = () => { hand.mode = 'touch'; begin(); };
if (TEST) {
  window.__tpl = () => tplPts(); window.__st = st; window.__meteors = () => meteors.length; window.__two = () => !!two;
  window.__raw = (P, wl) => { const keep = hand; hand = newHand(); const r = rawGesture(classify(wl || P)); hand = keep; return r; };
  window.__fakeCam = async () => { video.srcObject = await navigator.mediaDevices.getUserMedia({ video: true }); await video.play(); landmarker = { detectForVideo: () => ({ landmarks: [] }) }; };
  window.__arrows = () => arrows;
  window.__slots = () => slots.map(S => ({ g: S.hand.g, bm: !!S.bm, drag: !!S.drag, chain: !!S.chain }));
  window.__state = () => ({ trace: st.trace, ci: st.ci, done: !!traceDone, stars: stars.filter(s => !s.dying).map(s => ({ id: s.id, x: Math.round(s.x), y: Math.round(s.y), b: +s.b.toFixed(2) })), links: links.map(l => [l.a, l.b]), g: hand.g });
  window.__setStars = arr => { stars = []; links = []; arr.forEach(([x, y, b]) => { const s = addStar(x, y, b); if (s) s.born -= 2000; }); };
  window.__link = pairs => { pairs.forEach(([a, b]) => link(stars[a], stars[b])); links.forEach(l => l.born -= 2000); };
  begin();
}
})();
